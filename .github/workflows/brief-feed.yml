# Hosted AI gold brief for the app's AI Brief and News tabs.
#
# Asks gemini-2.5-flash, grounded with Google Search, for the daily gold brief and publishes the
# parsed result as one JSON file on the `brief-data` branch. Every install downloads that file, so
# the maintainer's Gemini key (repository secret GEMINI_API_KEY, never shipped in the app) makes a
# couple of dozen requests a day however many users there are.
#
# Why: the grounded call takes 15-60 seconds. It used to run inside every refresh, ahead of the
# Gold Index and the charts, which is what made the app slow to load. Reading this file instead is
# a ~200ms download. A user who adds their own Gemini key still gets their own fresh call — the
# app shows this brief immediately and swaps in theirs when it arrives.
#
# Runs by itself on GitHub. To force a refresh: Actions tab > "AI brief feed" > Run workflow
# (that path passes --force, so it ignores the freshness guard).
#
# A failed run (bad key, Gemini down, a brief that fails validation) publishes nothing and GitHub
# emails the owner; the last good brief stays up, and the app ignores a brief older than 12 hours.
# Until the secret exists, runs skip with a warning instead of failing. See CLAUDE.md.
name: AI brief feed

on:
  schedule:
    # Twice an hour, at :17 and :47. GitHub delays scheduled runs heavily and drops most of a
    # bunched window — measured on this repo's FRED feed, 2 of 10 slots a day, the 12:30 slot
    # landing 4-5h late. So this is an upper bound, not a promise: ask often and let
    # build_brief.py's 50-minute freshness guard decide, which is what actually caps the grounded
    # calls at ~24/day whatever GitHub fires. A skipped run costs nothing — it exits before the
    # Gemini call — so extra slots buy reliability for free.
    #
    # Deliberately odd minutes, 30 apart. This started as `5 * * * *` and got NOTHING in two
    # hours (2026-09-24, slots 05:05 and 06:05, workflow active, zero runs recorded). Round
    # minutes near the top of the hour are the most contended on GitHub's shared scheduler and
    # the first to be dropped under load; :17/:47 are not. Whether that is the whole story is
    # unproven — see CLAUDE.md §Hosted AI brief feed.
    #
    # Every day, not just weekdays: gold trades Sunday evening ET and the brief covers sessions.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Not configured yet is not an error: skip (with a warning on the run page) rather than fail
      # and email on every scheduled run. A key that is set but wrong still fails the build step.
      - name: Check the Gemini key is configured
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository secret GEMINI_API_KEY is not set, so no brief was generated. Add it under Settings > Secrets and variables > Actions."
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.configured == 'true'
        with:
          sparse-checkout: .github/brief-feed
          fetch-depth: 1

      - name: Read the currently published brief
        if: steps.key.outputs.configured == 'true'
        run: |
          if git fetch --quiet --depth 1 origin brief-data 2>/dev/null; then
            git show FETCH_HEAD:brief_daily.json > "$RUNNER_TEMP/published.json" || true
          fi

      - name: Generate the brief
        id: build
        if: steps.key.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python3 .github/brief-feed/build_brief.py
          --out "$RUNNER_TEMP/feed/brief_daily.json"
          --previous "$RUNNER_TEMP/published.json"
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Publish to the brief-data branch
        if: steps.key.outputs.configured == 'true' && steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED: ${{ steps.build.outputs.generated }}
        run: |
          cd "$RUNNER_TEMP/feed"
          cat > README.md <<'EOF'
          # brief-data

          Generated by `.github/workflows/brief-feed.yml` on `master`. Do not edit or merge.
          The branch holds a single commit that each run replaces.

          The brief is written by Google's Gemini model, grounded with Google Search. It is
          market commentary, not investment advice, and it can be wrong.
          EOF
          git init --quiet --initial-branch brief-data
          git add brief_daily.json README.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "AI brief generated $GENERATED"
          git push --quiet --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" brief-data
          echo "Published AI brief generated $GENERATED"
