# Hosted FRED feed for the app's 6 PM ET daily report.
#
# Fetches the three FRED series the Gold Index reads (DFII10, T10YIE, DGS2) with the maintainer's
# FRED key, stored as the repository secret FRED_API_KEY and never shipped in the app, and publishes
# them as one JSON file on the `fred-data` branch. Every install downloads that file from
# raw.githubusercontent.com, so the maintainer's key makes a handful of requests a day however many
# users there are. The app uses the feed only for users without a key of their own, or when their
# fetch fails; a user's own key always comes first, since a live fetch has FRED's latest print.
#
# Runs by itself on GitHub's servers, nothing to do by hand. To force a refresh: Actions tab >
# "FRED feed" > Run workflow. A failed run (bad key, FRED down, suspicious data) publishes nothing
# and GitHub emails the owner; the last good feed stays up, and the app ignores any series in it
# older than 10 days. Until the secret exists, runs skip with a warning instead of failing. See CLAUDE.md.
name: FRED feed

on:
  schedule:
    # Cron is UTC and ignores daylight saving. The Fed posts H.15 at 4:15 PM ET: 20:15 UTC in summer
    # (EDT), 21:15 UTC in winter (EST). The report runs at 6 PM ET: 22:00 / 23:00 UTC.
    #
    # These slots were every 20 minutes from 20:10 to 22:50, nine of them, on the theory that
    # density rides out GitHub's scheduling delays. Six days of runs (2026-09-17..23) say the
    # opposite: GitHub fired 2 of 10 slots a day and collapsed the whole bunched window into a
    # single run at ~22:5x UTC, i.e. AFTER the 6 PM report every single weekday, while the lone
    # 12:30 slot fired every day but 4-5 hours late. Reading of that: a burst is coalesced into
    # one run, so spread slots an hour apart instead and let each be late on its own. Watch
    # whether an evening run now lands before 22:00 UTC; if not, the trigger has to move off
    # GitHub's scheduler. A run that finds nothing new publishes nothing.
    - cron: "15 20-23 * * 1-5"
    # Morning catch-up for late postings and revisions.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fred-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Not configured yet is not an error: skip (with a warning on the run page) rather than fail
      # and email on every scheduled run. A key that is set but wrong still fails the build step.
      - name: Check the FRED key is configured
        id: key
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository secret FRED_API_KEY is not set, so nothing was fetched. Add it under Settings > Secrets and variables > Actions."
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.configured == 'true'
        with:
          sparse-checkout: .github/fred-feed
          fetch-depth: 1

      - name: Read the currently published feed
        if: steps.key.outputs.configured == 'true'
        run: |
          if git fetch --quiet --depth 1 origin fred-data 2>/dev/null; then
            git show FETCH_HEAD:fred_daily.json > "$RUNNER_TEMP/published.json" || true
          fi

      - name: Fetch FRED and build the feed
        id: build
        if: steps.key.outputs.configured == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python3 .github/fred-feed/build_feed.py
          --out "$RUNNER_TEMP/feed/fred_daily.json"
          --previous "$RUNNER_TEMP/published.json"

      - name: Publish to the fred-data branch
        if: steps.key.outputs.configured == 'true' && steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_DATE: ${{ steps.build.outputs.last_date }}
        run: |
          cd "$RUNNER_TEMP/feed"
          cat > README.md <<'EOF'
          # fred-data

          Generated by `.github/workflows/fred-feed.yml` on `master`. Do not edit or merge.
          The branch holds a single commit that each run replaces.

          This product uses the FRED® API but is not endorsed or certified by the Federal Reserve
          Bank of St. Louis. https://fred.stlouisfed.org/docs/api/terms_of_use.html
          EOF
          git init --quiet --initial-branch fred-data
          git add fred_daily.json README.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "FRED feed through $LAST_DATE"
          git push --quiet --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fred-data
          echo "Published FRED feed through $LAST_DATE"
